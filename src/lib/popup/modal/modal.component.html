@if (config) {
  <div class="modal-cntr">

    @if (type === modalTypes.Alert) {
      <div class="modal {{ size }}">
        <popup-modal-alert [setConfig]="config" (onClose)="close()" class="modal-content"></popup-modal-alert>
      </div>
    }

    @if (type === modalTypes.Confirmation) {
      <div class="modal {{ size }}">
        <popup-modal-confirmation [setConfig]="config" (onClose)="close()" (onConfirm)="confirm()" class="modal-content"></popup-modal-confirmation>
      </div>
    }

    @if (type === modalTypes.CustomComponent) {
      <div class="modal {{ size }}">
        <div class="modal-content">
          <ng-container *ngComponentOutlet="componentConfig.component; inputs: componentConfig.inputs; injector: componentInjector"></ng-container>
        </div>
      </div>
    }

    @if (type === modalTypes.Image) {
      <div class="modal {{ size }}">
        <div class="modal-content d-flex justify-content-center align-items-center">
          <img [src]="imageConfig.imageSource" class="img-fluid" style="max-height: 100%; object-fit: contain;" alt="" />
        </div>
      </div>
    }

    @if (config.fuzzyBackground) {
      <div class="dark-overlay"></div>
    }
    @if (config.closeOnOuterClick) {
      <div class="click-overlay" (click)="close()"></div>
    }

  </div>
}
